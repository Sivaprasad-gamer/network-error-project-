<!DOCTYPE html>
<html>
<head>
    <title>Network Error</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 150px;
            background: #f5f5f5;
        }

        h1 {
            color: red;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>⚠️ Network Error</h1>

    <p>Unable to connect to the internet.</p>
    <p>Please check your network connection.</p>

    <button onclick="retry()">Retry</button>

    <script>
        function retry() {
            alert("Network Error ❌");
        }
    </script>

</body>
</html>
